# The card uses the colors of the active theme.
# With light themes, stronger node colors are worth setting.
type: custom:radial-flow-card
title: Light theme
title_size: 18

solar:
  entity: sensor.pv_power
  color: "#e0a020"
  max_power: 10000
grid:
  entity: sensor.grid_power
  color: "#6f7883"
battery:
  entity: sensor.battery_power
  color: "#3f9e5c"
  state_of_charge: sensor.battery_soc

individual:
  - entity: sensor.wallbox_power
    name: Wallbox
    color: "#8c5cc0"
    icon: mdi:ev-station
