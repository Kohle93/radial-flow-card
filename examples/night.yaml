# Night mode: no generation, the battery supplies the house and the heat pump.
# PV and grid are at 0 W but keep their color and position.
type: custom:radial-flow-card
title: Night

solar:
  entity: sensor.pv_power
  max_power: 10000
grid:
  entity: sensor.grid_power
battery:
  entity: sensor.battery_power
  state_of_charge: sensor.battery_soc
  ring_source: soc

individual:
  - entity: sensor.heat_pump_power
    name: Heat pump
    icon: rf:heatpump
    color: "#e8833a"

display_zero_tolerance: 5
display_zero_lines:
  mode: show
