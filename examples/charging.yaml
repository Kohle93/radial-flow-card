# Überschussbetrieb: PV lädt Speicher und Wallbox, Rest geht ins Netz.
type: custom:radial-flow-card
title: Überschuss
speed: 2

solar:
  entity: sensor.pv_leistung
  max_power: 10000
grid:
  entity:
    consumption: sensor.netz_bezug
    production: sensor.netz_einspeisung
battery:
  entity:
    discharge: sensor.speicher_entladeleistung
    charge: sensor.speicher_ladeleistung
  state_of_charge: sensor.speicher_soc

individual:
  - entity: sensor.wallbox_leistung
    name: Wallbox
    icon: mdi:ev-station
    color: "#a97bd6"
    max_power: 11000
    secondary_entity: sensor.wallbox_status
    tap_action:
      action: navigate
      navigation_path: /lovelace/wallbox
