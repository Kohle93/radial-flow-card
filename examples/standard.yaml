# Typical setup with a battery and two consumers.
type: custom:radial-flow-card
title: Energy flow
title_size: 18
title_weight: 600

solar:
  entity: sensor.pv_power
  max_power: 10000

grid:
  entity:
    consumption: sensor.grid_import
    production: sensor.grid_export

battery:
  entity:
    discharge: sensor.battery_discharge_power
    charge: sensor.battery_charge_power
  state_of_charge: sensor.battery_soc

home:
  entity: sensor.home_consumption

individual:
  - entity: sensor.wallbox_power
    name: Wallbox
    icon: mdi:ev-station
    color: "#a97bd6"
    max_power: 11000
    tap_action:
      action: navigate
      navigation_path: /lovelace/wallbox
  - entity: sensor.heat_pump_power
    name: Heat pump
    icon: rf:heatpump
    color: "#e8833a"
    subtract_from_home: true

speed: 1.6
display_zero_tolerance: 5
